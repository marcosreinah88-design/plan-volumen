name: Avisos al celular
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: avisos
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: avisos-estado-${{ github.run_id }}
          restore-keys: avisos-estado-
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - name: Mandar avisos
        run: node avisos/enviar.mjs
        env:
          AVISOS_GIST: ${{ secrets.AVISOS_GIST }}
          GH_TOKEN: ${{ github.token }}
      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: avisos-estado-${{ github.run_id }}
