<title>Plan de Volumen Marcos</title>
<meta name="theme-color" content="#0E1113">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*CSS*/
</style>

<header class="top">
  <div class="in">
    <div class="brand"><i aria-hidden="true"></i>Volumen</div>
    <div class="meta">
      <button class="pill gym" id="blkpill" type="button">Sem 1</button>
      <span class="pill" id="syncpill" title="Dónde se guardan tus registros"><span class="sync" id="syncdot"></span><span id="synctxt">Este equipo</span></span>
      <button class="iconbtn" id="theme" type="button" aria-label="Cambiar entre tema claro y oscuro"></button>
      <button class="iconbtn" id="setbtn" type="button" aria-label="Ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
    </div>
  </div>
</header>

<main>
  <div class="acct" id="acct" role="status" hidden></div>
  <!-- HOY -->
  <section class="view" id="v-hoy" aria-label="Hoy">
    <div class="hero" id="hero"></div>
    <div class="week" id="week" aria-label="Semana"></div>
    <div class="med" id="med"></div>
    <div class="med wqm" id="wq" hidden></div>
    <div class="card wsum" id="wsum" hidden></div>
    <div id="next"></div>
    <div class="sec-h"><h2 id="tlh">Tu día</h2><span class="r eyebrow" id="tlsub"></span></div>
    <div class="tl" id="tl"></div>
    <div class="card habits" id="habits"></div>
  </section>

  <!-- ENTRENO -->
  <section class="view" id="v-entreno" aria-label="Entreno" hidden>
    <div class="chips" id="wdays" aria-label="Día de entreno"></div>
    <div id="wohead"></div>
    <div class="view" id="exlist" style="gap:12px"></div>
    <div id="wofoot"></div>
  </section>

  <!-- COMIDA -->
  <section class="view" id="v-comida" aria-label="Comida" hidden>
    <div class="sec-h"><h2>Comida</h2><span class="r eyebrow" id="cmsub"></span></div>
    <div class="menus" id="menus"></div>
    <div class="seg" id="cmseg" role="group" aria-label="Sección">
      <button type="button" data-s="semana">Semana</button>
      <button type="button" data-s="batch">Batch</button>
      <button type="button" data-s="super">Súper</button>
      <button type="button" data-s="inter">Intercambios</button>
      <button type="button" data-s="num">Números</button>
    </div>
    <div class="view" id="cmbody"></div>
  </section>

  <!-- PROGRESO -->
  <section class="view" id="v-progreso" aria-label="Progreso" hidden>
    <div class="sec-h"><h2>Progreso</h2><span class="r eyebrow" id="pgsub"></span></div>
    <div class="seg" id="pgseg" role="group" aria-label="Sección de progreso"><button type="button" data-pg="res">Resumen</button><button type="button" data-pg="ej">Ejercicios</button><button type="button" data-pg="cu">Cuerpo</button></div>
    <div class="card" id="pgw" style="display:grid;gap:12px"></div>
    <div class="card" id="pgweek" style="display:grid;gap:12px"></div>
    <div class="card" id="pgdias" style="display:grid;gap:12px"></div>
    <div class="card" id="pgex" style="display:grid;gap:12px;scroll-margin-top:70px"></div>
    <div class="card" id="pgrec" style="display:grid;gap:10px"></div>
    <div class="card" id="pgtan" style="display:grid;gap:8px"></div>
  </section>

  <!-- AJUSTES -->
  <section class="view" id="v-ajustes" aria-label="Ajustes" hidden>
    <div class="sec-h"><h2>Ajustes</h2></div>
    <div class="view" id="ajbody" style="gap:12px"></div>
  </section>

  <!-- GUÍA -->
  <section class="view guide" id="v-guia" aria-label="Guía" hidden></section>
</main>

<div class="timer" id="timer" role="status" aria-live="polite">
  <svg class="r" viewBox="0 0 52 52" aria-hidden="true"><circle class="trk" cx="26" cy="26" r="22"/><circle class="val" id="tmval" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="0"/><text x="26" y="26" id="tmtxt">0:00</text></svg>
  <div class="t"><b id="tmt">Descanso</b><span id="tms"></span></div>
  <div class="bs"><button class="btn ghost sm" type="button" id="tmadd">+15 s</button><button class="btn ghost sm" type="button" id="tmskip">Listo</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="lb" id="lb" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="lbt" id="lbbox"></div></div>

<nav class="nav" aria-label="Secciones">
  <div class="in" id="nav">
    <button type="button" data-v="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>Hoy</button>
    <button type="button" data-v="entreno"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>Entreno</button>
    <button type="button" data-v="comida"><svg viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8.5 7.5c0-1.5 1-2 1-3.5M12.5 7.5c0-1.5 1-2 1-3.5M16.5 7.5c0-1.5 1-2 1-3.5"/></svg>Comida</button>
    <button type="button" data-v="progreso"><svg viewBox="0 0 24 24"><path d="M3.5 3.5v17h17"/><path d="M7.5 15l4-4.5 3 3 5.5-6.5"/></svg>Progreso</button>
    <button type="button" data-v="guia"><svg viewBox="0 0 24 24"><path d="M4.5 19V5.5A2.5 2.5 0 0 1 7 3h12.5v14H7a2.5 2.5 0 0 0-2.5 2.5v0A2.5 2.5 0 0 0 7 22h12.5v-5"/></svg>Guía</button>
  </div>
</nav>
